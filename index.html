<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>More Good Days</title>

    <!--
      아이콘 (public/ 에 그대로 놓인 파일들, 만드는 법은 handoff/STATE.md 8장).

      홈 화면 아이콘은 워드마크, 브라우저 탭은 배지로 서로 다릅니다.
      탭은 투명이 맞고, **홈 화면 아이콘에는 투명이 있으면 안 됩니다** —
      iOS 가 모서리를 스스로 깎기 때문에 투명한 자리는 검게 남거나
      잘립니다. 워드마크 원본이 이미 초록으로 꽉 찬 불투명 정사각이라
      크기만 줄였습니다.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!--
      크기를 적어 둡니다. iOS 는 여러 후보 중에서 고르는데, 크기를 모르면
      받아 보고 정해야 해서 **추가하는 그 순간에 못 읽으면 그냥 포기하고
      제목 첫 글자로 아이콘을 만듭니다** (「M」). 적어 두면 고민이 없습니다.

      ⚠️ **주소가 `/apple-touch-icon.png` 가 아닌 이유** — iOS 는 홈 화면
      아이콘을 **주소 단위로 캐시하고, 바로가기를 지웠다 다시 만들어도
      같은 주소면 예전 것을 그대로 씁니다.** 한 번 「M」으로 굳은 기기는
      파일을 고쳐도 영영 안 바뀝니다. 주소를 바꾸는 것이 사용자에게
      웹사이트 데이터를 지우게 하지 않는 유일한 방법입니다 — 그쪽은
      **기록까지 함께 지웁니다.**

      그래서 아이콘 그림을 바꿀 때는 **파일 이름도 함께 바꾸세요.**
      `/apple-touch-icon.png` 은 링크가 없는 브라우저를 위한 관례 경로로
      남겨 둡니다 (내용은 같습니다).
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      주소창·상태바 색. 앱 배경과 같은 색이라 화면이 위로 이어져 보입니다.
      값은 ui/tokens.css 의 `--bg` 와 같아야 합니다. CSS 변수를 여기서
      읽을 수 없어 손으로 적은 값이고, **한쪽만 바꾸면 경계가 생깁니다.**
    -->
    <meta name="theme-color" content="#faf8f5" />

    <!-- iOS 에서 홈 화면 아이콘 아래 이름. 길면 iOS 가 알아서 줄입니다. -->
    <meta name="apple-mobile-web-app-title" content="More Good Days" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
