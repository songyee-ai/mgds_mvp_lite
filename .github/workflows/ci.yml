# 원칙 검사 · 테스트 · 빌드.
#
# README 의 「무엇을 만들지 않았는가」 표가 약속이 아니라 검사라고 말하는
# 근거가 이 워크플로입니다. `lint:principles` 가 여기서 돌지 않으면 그 표는
# 그냥 문장입니다.
#
# 순서에 뜻이 있습니다 — 타입 검사가 가장 빠르고, 원칙 검사가 그다음이며,
# 빌드는 번들 예산 검사를 품고 있어 마지막입니다.
name: test · lint:principles · build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # ⚠️ 이 이름을 바꾸지 마세요.
    #
    # GitHub 이 상태 검사로 보고하는 이름은 워크플로 이름이 아니라 **잡
    # 이름**이고, 이 문자열이 `main` 브랜치 룰셋의 **필수 상태 검사
    # 이름입니다.** 바꾸면 룰셋이 존재하지 않는 검사를 기다리게 되어
    # `main` 으로 아무것도 올라가지 못합니다.
    #
    # 고쳐야 한다면 룰셋을 먼저 고치세요:
    #   gh api repos/songyee-ai/mgds_mvp_lite/rulesets
    #
    # 이름 자체는 본 MVP(mgds_mvp)와 같은 문자열입니다. 두 저장소를
    # 오갈 때 같은 규약이 통하게 두었습니다.
    name: test · lint:principles · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # package-lock.json 을 그대로 따릅니다. `npm install` 은 잠금을
      # 바꿀 수 있어 CI 가 로컬과 다른 것을 검사하게 됩니다.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint:principles

      # 도메인 커버리지 100% 임계값이 vite.config.ts 에 있습니다.
      - run: npm run test:coverage

      # 타입 검사 → 빌드 → 초기 JS 예산(gzip 150kB). 넘으면 실패합니다.
      - run: npm run build
